services:
  whatsapp-bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3300:3300"
    # If your EvolutionGo instance runs in another docker-compose stack on this
    # same VPS, attach this service to its network (so EVOLUTION_BASE_URL can
    # just be "http://<evolution-container-name>:<port>") instead of publishing
    # a port here and going over the public internet:
    #
    # networks:
    #   - evolution_default
    #
    # networks:
    #   evolution_default:
    #     external: true
